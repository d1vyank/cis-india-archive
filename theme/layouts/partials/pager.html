{{ if gt .TotalPages 1 }}
<nav class="pager" aria-label="Pages">
  {{ with .Prev }}<a href="{{ .URL }}">Newer items</a>{{ else }}<span></span>{{ end }}
  <span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{ with .Next }}<a class="primary" href="{{ .URL }}">Older items</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
