baseURL = "/"
title = "CIS India Archive"
languageCode = "en"
disableKinds = ["RSS"]
disableAliases = true
relativeURLs = true
[pagination]
  pagerSize = 30
[taxonomies]
  tag = "tags"
  author = "authors"
  category = "categories"
[params]
  description = "An archive of blog posts, events and news published by the Centre for Internet and Society, India (2008 onwards)."
  original = "https://cis-india.org"
  issues = "https://github.com/d1vyank/cis-india-archive/issues"
[markup.goldmark.renderer]
  unsafe = true
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
